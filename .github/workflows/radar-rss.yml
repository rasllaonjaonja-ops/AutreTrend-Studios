name: AutreTrend RSS Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "sources.json"
      - ".github/workflows/radar-rss.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: autretrend-rss-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
      - name: Préparer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collecter les flux RSS/Atom
        run: python scripts/collect_rss.py
      - name: Vérifier les liens de sources officielles
        run: python scripts/verify_sources.py
      - name: Enregistrer le radar et la file éditoriale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar.json data/verification.json data/editorial_queue.json
          if git diff --cached --quiet; then
            echo "Aucun changement dans le radar."
          else
            git commit -m "data: actualiser le radar RSS"
            git pull --rebase origin main
            git push
          fi
